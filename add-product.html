<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Product | Amazon Warehouse</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell d-flex flex-column flex-lg-row">
	<aside class="sidebar p-3 p-lg-4 d-none d-lg-block">
		<a href="dashboard.html" class="brand d-flex align-items-center gap-2 fs-4 mb-4"><i class="bi bi-box-seam-fill text-amazon"></i> Warehouse</a>
		<nav class="nav flex-column">
			<a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
			<a class="nav-link" href="products.html"><i class="bi bi-boxes"></i> Products</a>
			<a class="nav-link active" href="add-product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
			<a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i> Orders</a>
			<a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-line"></i> Reports</a>
			<a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Profile</a>
			<a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
		</nav>
	</aside>
	<div class="main-content">
		<header class="topbar px-3 px-lg-4 py-3 sticky-top">
			<nav aria-label="breadcrumb"><ol class="breadcrumb small mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item"><a href="products.html">Products</a></li><li class="breadcrumb-item active">Add Product</li></ol></nav>
			<h1 class="page-title h3 mb-0">Add Product</h1>
		</header>
		<main class="p-3 p-lg-4">
			<div class="panel-card p-4 p-lg-5">
				<form class="needs-validation" novalidate>
					<div class="row g-3">
						<div class="col-lg-4"><label class="form-label">Product Name</label><input type="text" class="form-control" placeholder="Enter product name" required></div>
						<div class="col-lg-4"><label class="form-label">SKU</label><input type="text" class="form-control" placeholder="AW-0000" required></div>
						<div class="col-lg-4"><label class="form-label">Category</label><select class="form-select" required><option value="">Select category</option><option>Electronics</option><option>Packaging</option><option>Warehouse Tools</option></select></div>
						<div class="col-lg-4"><label class="form-label">Supplier</label><select class="form-select" required><option value="">Select supplier</option><option>North Supply</option><option>Prime Distributors</option></select></div>
						<div class="col-lg-4"><label class="form-label">Quantity</label><input type="number" class="form-control" min="0" placeholder="0" required></div>
						<div class="col-lg-4"><label class="form-label">Unit Price</label><input type="number" class="form-control" min="0" step="0.01" placeholder="0.00" required></div>
						<div class="col-lg-6"><label class="form-label">Low Stock Alert</label><input type="number" class="form-control" min="0" placeholder="10" required></div>
						<div class="col-lg-6"><label class="form-label">Status</label><select class="form-select" required><option value="">Select status</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select></div>
						<div class="col-12"><label class="form-label">Product Description</label><textarea class="form-control" rows="4" placeholder="Write a short description"></textarea></div>
						<div class="col-12">
							<div class="d-flex flex-wrap gap-2 justify-content-end mt-2">
								<a href="products.html" class="btn btn-outline-amazon px-4">Cancel</a>
								<button type="reset" class="btn btn-light px-4">Reset</button>
								<button type="submit" class="btn btn-amazon px-4">Save Product</button>
							</div>
						</div>
					</div>
				</form>
			</div>
		</main>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
