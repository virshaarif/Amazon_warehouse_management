<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stock In | Amazon Warehouse</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell d-flex flex-column flex-lg-row">
	<aside class="sidebar p-3 p-lg-4 d-none d-lg-block">
		<a href="dashboard.html" class="brand d-flex align-items-center gap-2 fs-4 mb-4"><i class="bi bi-box-seam-fill text-amazon"></i> Warehouse</a>
		<nav class="nav flex-column">
			<a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
			<a class="nav-link" href="products.html"><i class="bi bi-boxes"></i> Products</a>
			<a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a>
			<a class="nav-link" href="suppliers.html"><i class="bi bi-truck"></i> Suppliers</a>
			<a class="nav-link active" href="stock-in.html"><i class="bi bi-box-arrow-in-down"></i> Stock In</a>
			<a class="nav-link" href="stock-out.html"><i class="bi bi-box-arrow-up"></i> Stock Out</a>
			<a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i> Orders</a>
			<a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-line"></i> Reports</a>
			<a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Profile</a>
			<a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
		</nav>
	</aside>

	<div class="main-content">
		<header class="topbar px-3 px-lg-4 py-3 sticky-top">
			<div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
				<div>
					<nav aria-label="breadcrumb"><ol class="breadcrumb small mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Stock In</li></ol></nav>
					<h1 class="page-title h3 mb-0">Stock In</h1>
				</div>
			</div>
		</header>

		<main class="p-3 p-lg-4">
			<div class="panel-card p-4 p-lg-5">
				<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
					<div>
						<h2 class="section-title mb-1">Record Incoming Stock</h2>
						<p class="muted-text mb-0">Use this form to add received products to inventory.</p>
					</div>
					<span class="badge badge-soft-success rounded-pill">Incoming stock entry</span>
				</div>
				<form class="row g-3">
					<div class="col-md-6"><label class="form-label">Select Product</label><input class="form-control" placeholder="Search product"></div>
					<div class="col-md-3"><label class="form-label">Quantity</label><input class="form-control" placeholder="0"></div>
					<div class="col-md-3"><label class="form-label">Reference</label><input class="form-control" placeholder="GRN-001"></div>
					<div class="col-md-6"><label class="form-label">Supplier</label><select class="form-select"><option>North Supply</option><option>Prime Distributors</option></select></div>
					<div class="col-md-6"><label class="form-label">Received By</label><input class="form-control" placeholder="Warehouse staff"></div>
					<div class="col-12 d-flex justify-content-end gap-2"><button class="btn btn-outline-amazon" type="reset">Reset</button><button class="btn btn-amazon" type="submit">Record Stock In</button></div>
				</form>
			</div>
		</main>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
